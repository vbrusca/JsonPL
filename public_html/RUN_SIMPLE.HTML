            /**
             * Name: localEventWireUpClick
             * Desc: A generic event handler for piping local DOM click events to JPL.
             * Arg0: HTML5 DOM element click event
             */
            function localEventWireUpClick(event) {
                var targetElement = event.target;
                var targetId = targetElement.id;
                var eventType = event.type;
                var eventPath = targetId + "." + eventType;
                var callObj = {"sys": "call", "name": eventPath, 
                    "args": [
                        { "sys": "const", "val": {"sys": "val", "type": "string", "v": targetId}},
                        { "sys": "const", "val": {"sys": "val", "type": "string", "v": eventType}}                            
                    ]
                };

                console.log("localEventWireUpClick: " + eventPath);
                if(eventPath == "run_program_button.click") {
                    ljpl = new jsonPlState();
                    lcodeStr = txtAreaSrc.value;
                    ljpl.program = JSON.parse(lcodeStr);
                
                    if(!ljpl.validateSysObjClass(ljpl.program)) {
                        ljpl.wr("runProgram: Error: could not validate the class object.");
                        return;
                    }

                    ljpl.wr("====================== Program Results ======================");
                    ljpl.runProgram();
                } else if(eventPath == "clear_output_button.click") {
                    txtAreaMsg.value = "";

                } else if(eventPath == "clear_program_button.click") {
                    txtAreaSrc.value = "";

                } else if(eventPath == "run_program_call_button.click") {
                    if(ljpl != null) {
                        if(ljpl.program != null) {
                            var lcallObj = ljpl.program.call;
                            console.log("localEventWireUpClick: found call object:" + JSON.stringify(ljpl.program.call));
                            if(lcallObj != null) {
                                if(ljpl.isSysObj(lcallObj)) {
                                    if(ljpl.isSysObjCall(lcallObj)) {
                                        if(ljpl.validateSysObjCall(lcallObj)) {
                                            ljpl.runClassFunc(lcallObj);
                                        } else {
                                            console.log("localEventWireUpClick: Could not validate the call object.");
                                        }
                                    } else {
                                        console.log("localEventWireUpClick: Could not identify the call object.");
                                    }
                                } else {
                                    console.log("localEventWireUpClick: Could not identify a sys object.");
                                }
                            } else {
                                console.log("localEventWireUpClick: Could not find a proper call object to run for the given program.");
                            }
                        } else {
                                console.log("localEventWireUpClick: Could not find a loaded program to execute the call object for.");                        
                        }
                    } else {
                            console.log("localEventWireUpClick: Could not find a loaded JSONPL object to process.");                        
                    }
                } else {
                    jpl.runClassFunc(callObj);
                }
            }

        } catch(e) {
            var s = "Unhandled error encountered!";
